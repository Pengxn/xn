name: test

on: [push]

jobs:
  test-powershell:
    name: Test WindowsPowerShell
    runs-on: windows-latest
    steps:
      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v4

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install xn bucket
        shell: powershell
        run: scoop bucket add xn https://github.com/Pengxn/xn

      - name: Check xn Branch and Align with Current Branch
        shell: powershell
        run: |
          $CURRENT_BRANCH = $env:GITHUB_REF_NAME
          $SCOOP_ROOT = (Get-Item (scoop prefix scoop)).Parent.Parent.Parent.FullName
          $XN_BUCKET_PATH = Join-Path $SCOOP_ROOT "buckets\xn"
          git -C $XN_BUCKET_PATH checkout $CURRENT_BRANCH

      - name: Check Version and Test
        shell: powershell
        run: |
          .\bin\Check-Version.ps1
          .\test\Install-Test.ps1

  test-pwsh:
    name: Test PowerShell Core
    runs-on: windows-latest
    steps:
      - name: Setup Scoop
        uses: MinoruSekine/setup-scoop@v4

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install xn bucket
        shell: powershell
        run: scoop bucket add xn https://github.com/Pengxn/xn

      - name: Check xn Branch and Align with Current Branch
        shell: powershell
        run: |
          $CURRENT_BRANCH = $env:GITHUB_REF_NAME
          $SCOOP_ROOT = (Get-Item (scoop prefix scoop)).Parent.Parent.Parent.FullName
          $XN_BUCKET_PATH = Join-Path $SCOOP_ROOT "buckets\xn"
          git -C $XN_BUCKET_PATH checkout $CURRENT_BRANCH

      - name: Check Version and Test
        shell: pwsh
        run: |
          .\bin\Check-Version.ps1
          .\test\Install-Test.ps1
